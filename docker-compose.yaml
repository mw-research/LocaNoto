# Bau und Umgebung stehen einmal hier und werden von allen Diensten
# benutzt. Zweimal gepflegt waeren sie irgendwann verschieden -- und die
# Schnittstelle wuerde mit anderen Modellen antworten als die Oberflaeche,
# ohne dass es jemandem auffaellt.
x-bau: &bau
  context: .
  args:
    # Wird beim Bauen in das Image geladen und zur Laufzeit von dort
    # gelesen. Leer lassen ist nicht vorgesehen -- wer ohne Modell
    # arbeiten will, setzt RERANKER_MODEL im environment auf "".
    RERANKER_MODEL: ${RERANKER_MODEL-BAAI/bge-reranker-v2-m3}
    # Auf 0 setzen, wenn der Xet-Weg in eurem Netz schneller ist.
    HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}

x-umgebung: &umgebung
  - APP_TOPIC=${APP_TOPIC:-Allgemein}
  - COMPANY_NAME=${COMPANY_NAME:-LocaNoto}
  - EXPERT_ROLE=${EXPERT_ROLE:-Experte}
  - OPENAI_API_KEY=${OPENAI_API_KEY}
  - OPENAI_BASE_URL=${OPENAI_BASE_URL}
  - ADMIN_USERS=${ADMIN_USERS:-admin}
  # Modelle und ihre Endpunkte. Leere Werte fallen auf OPENAI_BASE_URL
  # und OPENAI_API_KEY zurueck (siehe llm.py).
  #
  # Die Zahlenwerte werden bewusst OHNE Vorgabe durchgereicht: ein hier
  # eingetragener Standard wuerde den im Code ueberschreiben, auch wenn in
  # der .env nichts steht -- derselbe Wert stuende dann an drei Stellen.
  # paths.env_int/env_float behandeln einen leeren Wert als "nicht
  # gesetzt".
  - CHAT_MODEL=${CHAT_MODEL:-qwen3.8:27b}
  - CHAT_BASE_URL=${CHAT_BASE_URL:-}
  - CHAT_API_KEY=${CHAT_API_KEY:-}
  - CHAT_API_VERSION=${CHAT_API_VERSION:-}
  - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:8b}
  - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
  - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
  - EMBEDDING_API_VERSION=${EMBEDDING_API_VERSION:-}
  - VISION_MODEL=${VISION_MODEL:-qwen3-vl:32b}
  - VISION_BASE_URL=${VISION_BASE_URL:-}
  - VISION_API_KEY=${VISION_API_KEY:-}
  - VISION_API_VERSION=${VISION_API_VERSION:-}
  - MIN_LONG_EDGE=${MIN_LONG_EDGE:-}
  - MIN_AREA=${MIN_AREA:-}
  - VISION_PARALLEL=${VISION_PARALLEL:-}
  - EMBED_PARALLEL=${EMBED_PARALLEL:-}
  - VISION_VERSUCHE=${VISION_VERSUCHE:-}
  - VISION_WARTEN=${VISION_WARTEN:-}
  - VISION_TIMEOUT=${VISION_TIMEOUT:-}
  - SEITEN_MELDUNG=${SEITEN_MELDUNG:-}
  - VISION_MAX_TOKENS=${VISION_MAX_TOKENS:-}
  - CHAT_BILD_MAX_KANTE=${CHAT_BILD_MAX_KANTE:-}
  - TITLE_MODEL=${TITLE_MODEL:-}
  - TITLE_BASE_URL=${TITLE_BASE_URL:-}
  - TITLE_API_KEY=${TITLE_API_KEY:-}
  - TITLE_API_VERSION=${TITLE_API_VERSION:-}
  - RERANKER_MODEL=${RERANKER_MODEL-BAAI/bge-reranker-v2-m3}
  - RERANKER_BASE_URL=${RERANKER_BASE_URL:-}
  - RERANKER_API_KEY=${RERANKER_API_KEY:-}
  - RERANKER_API_MODEL=${RERANKER_API_MODEL:-}
  - RERANKER_TIMEOUT=${RERANKER_TIMEOUT:-}
  - RERANKER_RUECKFALL=${RERANKER_RUECKFALL:-}
  - RERANKER_ERNEUT=${RERANKER_ERNEUT:-}
  # Zeitlimits, die der Code liest und die bisher nicht ankamen:
  # ohne sie war EMBED_TIMEOUT im Container nicht einstellbar,
  # und ein haengender Modellserver kostete 120 s je Anfrage.
  - EMBED_TIMEOUT=${EMBED_TIMEOUT:-}
  - SUCHE_EMBED_TIMEOUT=${SUCHE_EMBED_TIMEOUT:-}
  - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-}
  - RERANKER_MAX_LENGTH=${RERANKER_MAX_LENGTH:-}
  - RRF_K=${RRF_K:-}
  # Feineinstellungen, die der Code liest und die bisher nicht
  # ankamen. CHROMA_EINZELN erlaubt der Schnittstelle bewusst die
  # Dateiablage statt des Dienstes -- ohne Durchreichung war das
  # dokumentiert, aber unmoeglich.
  - CHROMA_EINZELN=${CHROMA_EINZELN:-}
  - CHROMA_SCHREIBSTAPEL=${CHROMA_SCHREIBSTAPEL:-}
  - EMBED_MIN_CHARS=${EMBED_MIN_CHARS:-}
  - MAX_KOPFZEILE_CHARS=${MAX_KOPFZEILE_CHARS:-}
  - CAPTION_HEIGHT=${CAPTION_HEIGHT:-}
  - TOP_K=${TOP_K:-}
  - MAX_TABLE_CHARS=${MAX_TABLE_CHARS:-}
  - HELPER_TIMEOUT=${HELPER_TIMEOUT:-}
  - ANSWER_TIMEOUT=${ANSWER_TIMEOUT:-}
  - LLM_VERSUCHE=${LLM_VERSUCHE:-}
  - FEEDBACK_ANZEIGE=${FEEDBACK_ANZEIGE:-}
  - TABELLEN_PFAD=${TABELLEN_PFAD:-}
  - TABELLEN_GROSS_AB=${TABELLEN_GROSS_AB:-}
  - TABELLEN_KOPF_SUCHEN=${TABELLEN_KOPF_SUCHEN:-}
  - TABELLEN_MAX_DATEIEN=${TABELLEN_MAX_DATEIEN:-}
  - TABELLEN_MAX_ZEILEN=${TABELLEN_MAX_ZEILEN:-}
  - TABELLEN_BEISPIELE=${TABELLEN_BEISPIELE:-}
  - TABELLEN_BEISPIELE_BIS=${TABELLEN_BEISPIELE_BIS:-}
  - TABELLEN_KATALOG_MAX_CHARS=${TABELLEN_KATALOG_MAX_CHARS:-}
  - TABELLEN_ROUTEN_AB=${TABELLEN_ROUTEN_AB:-}
  - TABELLEN_BLAETTER=${TABELLEN_BLAETTER:-}
  - TABELLEN_TREFFER_BLAETTER=${TABELLEN_TREFFER_BLAETTER:-}
  - TABELLEN_SPEICHER_BLAETTER=${TABELLEN_SPEICHER_BLAETTER:-}
  - TABELLEN_DEFAULT_ON=${TABELLEN_DEFAULT_ON:-}
  - CHROMA_HOST=${CHROMA_HOST:-}
  - CHROMA_PORT=${CHROMA_PORT:-}
  - CHROMA_SSL=${CHROMA_SSL:-}
  - CHROMA_TOKEN=${CHROMA_TOKEN:-}
  - CHROMA_TOKEN_HEADER=${CHROMA_TOKEN_HEADER:-}
  - CHROMA_CLOUD_KEY=${CHROMA_CLOUD_KEY:-}
  - CHROMA_CLOUD_TENANT=${CHROMA_CLOUD_TENANT:-}
  - CHROMA_CLOUD_DATABASE=${CHROMA_CLOUD_DATABASE:-}
  - INGEST_RAUM=${INGEST_RAUM:-}
  # Verschluesselung und Anmeldung. Der Schluessel liegt normalerweise in
  # config/schluessel.key -- hier durchgereicht fuer den Fall, dass er als
  # Secret aus der Umgebung kommen soll.
  - LOCANOTO_SCHLUESSEL=${LOCANOTO_SCHLUESSEL:-}
  - LOCANOTO_SCHLUESSEL_DATEI=${LOCANOTO_SCHLUESSEL_DATEI:-}
  - SITZUNG_MINUTEN=${SITZUNG_MINUTEN:-}
  # Speicherwurzeln IM Container. Wohin sie vom Host zeigen, steht bei den
  # volumes; hier steht nur, wo die Anwendung sie erwartet. LOCANOTO_INDEX
  # zeigt bewusst NICHT unter /app/data: dort liegt der persistente
  # Bestand, und ableitbare SQLite-Dateien gehoeren auf die lokale Platte.
  - LOCANOTO_DATEN=/app/data
  - LOCANOTO_KONFIG=/app/config
  - LOCANOTO_INDEX=${LOCANOTO_INDEX:-/app/data}
  # Dokumente aus ownCloud oder Nextcloud. Bei aktiver
  # Zwei-Faktor-Anmeldung ein App-Passwort, nicht das Anmeldepasswort.
  - OWNCLOUD_URL=${OWNCLOUD_URL:-}
  - OWNCLOUD_USER=${OWNCLOUD_USER:-}
  - OWNCLOUD_PASSWORT=${OWNCLOUD_PASSWORT:-}
  - OWNCLOUD_TIMEOUT=${OWNCLOUD_TIMEOUT:-}
  # Die Gruppenabfrage verlangt in ownCloud Verwalterrechte; das
  # Holen der Dateien nicht. Deshalb getrennt setzbar.
  - OWNCLOUD_ADMIN_USER=${OWNCLOUD_ADMIN_USER:-}
  - OWNCLOUD_ADMIN_PASSWORT=${OWNCLOUD_ADMIN_PASSWORT:-}
  - OWNCLOUD_WURZEL=${OWNCLOUD_WURZEL:-}
  - OWNCLOUD_GRUPPEN_HOECHSTALTER=${OWNCLOUD_GRUPPEN_HOECHSTALTER:-}
  - INGEST_ORDNER=${INGEST_ORDNER:-}
  # Abzug der Vektordatenbank -- der einzige nicht ableitbare
  # Zustand, der nicht auf den Netzspeicher gehoert.
  - SICHERUNG_PFAD=${SICHERUNG_PFAD:-}
  - SICHERUNG_BEHALTEN=${SICHERUNG_BEHALTEN:-}
  # Strenger Betrieb: auch ein Verwalter erfaehrt nichts ueber
  # fremde persoenliche Raeume, nicht einmal Dateinamen.
  - PRIVAT_STRENG=${PRIVAT_STRENG:-}
  - NOTZUGANG_STUNDEN=${NOTZUGANG_STUNDEN:-}
  - NOTZUGANG_ANTRAG_TAGE=${NOTZUGANG_ANTRAG_TAGE:-}
  - BUDGET_FENSTER_MINUTEN=${BUDGET_FENSTER_MINUTEN:-}
  - BUDGET_ABSCHNITTE=${BUDGET_ABSCHNITTE:-}
  - BUDGET_RAEUME=${BUDGET_RAEUME:-}
  - PROTOKOLL_ZIEL=${PROTOKOLL_ZIEL:-}

services:
  locanoto_bot:
    build: *bau
    image: locanoto:lokal
    container_name: ${CONTAINER_NAME:-locanoto_app}
    restart: unless-stopped
    environment: *umgebung
    ports:
      - "${APP_PORT:-8501}:8501"

    # Der CrossEncoder ist der einzige Torch-Nutzer im Container und laeuft
    # ohne die folgende Sektion auf der CPU. Bei 1024 Token Fenster und rund
    # 15-20 Kandidaten pro Frage kostet das einige Sekunden; mit GPU ist es
    # kaum messbar.
    #
    # Einkommentieren, wenn auf dem Host das NVIDIA Container Toolkit
    # eingerichtet ist. Wer bewusst auf der CPU bleibt, sollte stattdessen in
    # requirements.txt auf die CPU-Variante von torch wechseln -- das spart
    # mehrere GB Imagegroesse.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      # Ein einziger Mount fuer den kompletten Datenbestand. Er entspricht
      # exakt dem data/-Ordner, der zwischen Installationen weitergegeben
      # wird -- Hineinkopieren und Selbst-Erzeugen sind damit austauschbar.
      #
      #   data/dokumente   Original-PDFs
      #   data/chats       Chatverlaeufe je Nutzer
      #   data/chroma_db   Vektordatenbank
      #
      # Frueher lagen hier drei Einzel-Mounts nach /app/chroma_db,
      # /app/dokumente und /app/chats. Die App las aber aus /app/data/... --
      # also aus einem ungemounteten, leeren Verzeichnis.
      #
      # DATEN_PFAD und KONFIG_PFAD zeigen auf den persistenten Speicher des
      # Servers oder Clusters. Ohne Angabe bleibt es bei ./data und ./config
      # neben der Compose-Datei -- richtig fuer eine Einzelinstallation,
      # aber nichts, worauf man einen Cluster stellt.
      - ${DATEN_PFAD:-./data}:/app/data

      # Als Verzeichnis gemountet, nicht als Einzeldatei: ein Bind-Mount auf
      # eine einzelne Datei bricht, sobald ein Werkzeug sie ersetzt statt sie
      # zu ueberschreiben.
      - ${KONFIG_PFAD:-./config}:/app/config

      # Ableitbare Zwischenstaende: Vektordatenbank, Stichwortindex,
      # Listenkatalog, Kennungen laufender Prozesse. Ein benanntes Volume
      # und kein Bind-Mount auf den Netzspeicher -- siehe LOCANOTO_INDEX
      # oben. Wird nur benutzt, wenn LOCANOTO_INDEX darauf zeigt.
      - locanoto_index:/var/lib/locanoto

  # --- VEKTORDATENBANK ALS DIENST ---
  #
  # Nur aktiv, wenn CHROMA_HOST gesetzt ist -- ohne das greifen Oberflaeche
  # und Skripte weiter auf die Dateiablage zu, und dieser Container laeuft
  # daneben ins Leere.
  #
  # Gebraucht wird er, sobald mehr als ein Prozess auf denselben Bestand
  # zugreift. Genau das tut die Schnittstelle: zwei Prozesse auf derselben
  # Dateiablage beschaedigen den Index, und zwar ohne Fehlermeldung.
  #
  # Dasselbe Image wie die Anwendung, damit Server und Clients dieselbe
  # Chroma-Fassung benutzen. Eine abweichende Fassung liest den Bestand
  # unter Umstaenden nicht.
  chroma:
    build: *bau
    image: locanoto:lokal
    container_name: ${CONTAINER_NAME:-locanoto_app}_chroma
    restart: unless-stopped
    command: >
      chroma run --path ${LOCANOTO_INDEX:-/app/data}/chroma_db
      --host 0.0.0.0 --port 8000
    environment:
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_ANONYMIZED_TELEMETRY=False
    volumes:
      - ${DATEN_PFAD:-./data}:/app/data
      - locanoto_index:/var/lib/locanoto
    # Bewusst ohne ports: erreichbar nur innerhalb des Compose-Netzes. Der
    # Chroma-Server kennt keine Rechte -- wer ihn erreicht, liest alles.

  # --- HTTP-SCHNITTSTELLE ---
  #
  # Dieselbe Suche wie in der Oberflaeche, ohne Browser. Zugang ueber ein
  # Token je Nutzer (create_token.py).
  api:
    build: *bau
    image: locanoto:lokal
    container_name: ${CONTAINER_NAME:-locanoto_app}_api
    restart: unless-stopped
    command: >
      uvicorn api:app --host 0.0.0.0 --port 8600
    environment: *umgebung
    ports:
      # An 127.0.0.1 gebunden: erreichbar vom Server selbst und ueber einen
      # SSH-Tunnel, nicht aus dem Netz. Der Verkehr ist unverschluesselt,
      # das Token waere sonst auf dem Draht mitlesbar. Fuer einen Zugriff
      # von aussen gehoert ein Reverse Proxy mit TLS davor.
      - "127.0.0.1:${API_PORT:-8600}:8600"
    volumes:
      - ${DATEN_PFAD:-./data}:/app/data
      - ${KONFIG_PFAD:-./config}:/app/config
      - locanoto_index:/var/lib/locanoto
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8600/gesundheit')"]
      interval: 30s
      timeout: 5s
      retries: 3

# Standortspezifisches gehoert NICHT hierher, sondern in eine
# docker-compose.override.yaml daneben. Docker Compose liest sie automatisch
# mit, sie ist gitignored und ueberlebt damit jedes Update aus dem Repo.
#
# Typischer Fall -- LiteLLM als Container im selben Netz plus aktive GPU:
#
#   services:
#     locanoto_bot:
#       deploy:
#         resources:
#           reservations:
#             devices:
#               - driver: nvidia
#                 count: all
#                 capabilities: [gpu]
#       networks:
#         - mein-netz
#   networks:
#     mein-netz:
#       external: true

# --- ABLEITBARE ZWISCHENSTAENDE ---
#
# Ein benanntes Volume, absichtlich kein Bind-Mount. Hier liegen die
# SQLite-Dateien: Vektordatenbank und Stichwortindex. Sie muessen auf
# einem Dateisystem liegen, das Dateisperren und gemeinsamen Speicher
# beherrscht -- ueber NFS oder SMB tut es das nicht, und das Ergebnis ist
# kein Fehler, sondern ein beschaedigter Index.
#
# Der Verlust kostet nichts: der Stichwortindex baut sich aus den
# Sammlungen neu auf, gemessen rund 18.600 Abschnitte je Sekunde. Die
# Vektordatenbank muesste allerdings neu eingelesen werden -- wer sie
# ebenfalls persistent haben will, gibt dem Volume einen Treiber auf
# Blockspeicher, nicht auf ein Netzlaufwerk.
  # --- OWNCLOUD, MITGELIEFERT ---
  #
  # Ein eigener Dienst und NICHT im selben Abbild. Zwei Programme in einem
  # Container heisst zwei Prozesse um PID 1, gemeinsame Protokolle, und
  # ein Update von LocaNoto risse ownCloud mit. Es ist trotzdem dieselbe
  # Installation: ein compose, ein Netz, ein Befehl.
  #
  #   docker compose --profile owncloud up -d
  #   docker compose exec -T locanoto_bot python einrichten.py
  #
  # Das Profil heisst, dass diese Dienste NUR mit --profile starten. Wer
  # ein vorhandenes ownCloud im Haus hat, laesst es weg und traegt in die
  # .env dessen Adresse ein -- daran aendert sich nichts.
  owncloud:
    profiles: ["owncloud"]
    image: owncloud/server:10.15
    container_name: ${CONTAINER_NAME:-locanoto_app}_owncloud
    restart: unless-stopped
    ports:
      - "${OWNCLOUD_PORT:-8080}:8080"
    depends_on:
      owncloud_db:
        condition: service_healthy
      owncloud_redis:
        condition: service_healthy
    environment:
      # Die Adresse, unter der ownCloud sich selbst sieht. Stimmt sie
      # nicht, laufen Anmeldung und Freigaben in Weiterleitungen, die ins
      # Leere zeigen -- der haeufigste Fehlgriff beim ersten Aufsetzen.
      - OWNCLOUD_DOMAIN=${OWNCLOUD_DOMAIN:-localhost:8080}
      - OWNCLOUD_TRUSTED_DOMAINS=${OWNCLOUD_TRUSTED_DOMAINS:-localhost,127.0.0.1,owncloud}
      - OWNCLOUD_DB_TYPE=mysql
      - OWNCLOUD_DB_NAME=owncloud
      - OWNCLOUD_DB_USERNAME=owncloud
      - OWNCLOUD_DB_PASSWORD=${OWNCLOUD_DB_PASSWORT:-owncloud}
      - OWNCLOUD_DB_HOST=owncloud_db
      - OWNCLOUD_ADMIN_USERNAME=${OWNCLOUD_ADMIN_USER:-admin}
      - OWNCLOUD_ADMIN_PASSWORD=${OWNCLOUD_ADMIN_PASSWORT:?OWNCLOUD_ADMIN_PASSWORT muss gesetzt sein}
      - OWNCLOUD_MYSQL_UTF8MB4=true
      - OWNCLOUD_REDIS_ENABLED=true
      - OWNCLOUD_REDIS_HOST=owncloud_redis
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      # Auf den persistenten Speicher, wie alles andere auch. Hier liegen
      # die Dateien der Nutzer -- LocaNoto verschluesselt sie nicht und
      # kann es nicht: ownCloud muss sie ausliefern. Der Datentraeger
      # gehoert also verschluesselt, siehe README.
      - ${OWNCLOUD_PFAD:-./data/owncloud}:/mnt/data

  owncloud_db:
    profiles: ["owncloud"]
    image: mariadb:10.11
    container_name: ${CONTAINER_NAME:-locanoto_app}_owncloud_db
    restart: unless-stopped
    command: ["--max-allowed-packet=128M", "--innodb-log-file-size=64M"]
    environment:
      - MARIADB_ROOT_PASSWORD=${OWNCLOUD_DB_PASSWORT:-owncloud}
      - MARIADB_USER=owncloud
      - MARIADB_PASSWORD=${OWNCLOUD_DB_PASSWORT:-owncloud}
      - MARIADB_DATABASE=owncloud
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - owncloud_db:/var/lib/mysql

  owncloud_redis:
    profiles: ["owncloud"]
    image: redis:7-alpine
    container_name: ${CONTAINER_NAME:-locanoto_app}_owncloud_redis
    restart: unless-stopped
    command: ["--databases", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - owncloud_redis:/data


volumes:
  locanoto_index:

  owncloud_db:
  owncloud_redis:
# --- DER INSTALLATIONSSCHLUESSEL ALS SECRET ---
#
# LOCANOTO_SCHLUESSEL in der .env sieht dichter aus, als es ist: die .env
# liegt auf einer Platte, meist derselben wie die Daten. Ein Secret liegt
# im Container unter /run/secrets -- in tmpfs, also im Arbeitsspeicher.
# Ein kopiertes Volume, ein Snapshot, eine ausgebaute Platte enthalten
# ihn dann nicht.
#
# So in Betrieb nehmen:
#
#   1. Schluessel aus der laufenden Installation sichern:
#        docker compose exec -T locanoto_bot cat /app/config/schluessel.key \
#            > ./secrets/schluessel.key
#      Oder einen neuen erzeugen:
#        head -c 32 /dev/urandom | base64 > ./secrets/schluessel.key
#      Rechte eng: chmod 600 ./secrets/schluessel.key
#
#   2. In der .env setzen:
#        LOCANOTO_SCHLUESSEL_DATEI=/run/secrets/locanoto_schluessel
#
#   3. Die zwei Bloecke unten einkommentieren und in jedem Dienst
#      "secrets: [locanoto_schluessel]" ergaenzen.
#
#   4. docker compose up -d, dann in der Seitenleiste unter
#      "Sicherheitslage" nachsehen: dort muss "Aus einem Secret" stehen.
#
# Danach gehoert ./secrets/ NICHT ins Git und NICHT in die Sicherung der
# Daten -- der Sinn ist ja, dass Schluessel und Daten getrennt liegen.
#
# secrets:
#   locanoto_schluessel:
#     file: ./secrets/schluessel.key
