services:
  locanoto_bot:
    build:
      context: .
      args:
        # Wird beim Bauen in das Image geladen und zur Laufzeit von dort
        # gelesen. Leer lassen ist nicht vorgesehen -- wer ohne Modell
        # arbeiten will, setzt RERANKER_MODEL im environment auf "".
        RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
        # Auf 0 setzen, wenn der Xet-Weg in eurem Netz schneller ist.
        HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
    container_name: ${CONTAINER_NAME:-locanoto_app}
    restart: unless-stopped
    environment:
      - APP_TOPIC=${APP_TOPIC:-Allgemein}
      - COMPANY_NAME=${COMPANY_NAME:-LocaNoto}
      - EXPERT_ROLE=${EXPERT_ROLE:-Experte}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - ADMIN_USERS=${ADMIN_USERS:-admin}
      # Modelle und ihre Endpunkte. Leere Werte fallen auf OPENAI_BASE_URL
      # und OPENAI_API_KEY zurueck (siehe llm.py).
      #
      # Die Zahlenwerte werden bewusst OHNE Vorgabe durchgereicht: ein hier
      # eingetragener Standard wuerde den im Code ueberschreiben, auch wenn in
      # der .env nichts steht -- derselbe Wert stuende dann an drei Stellen.
      # paths.env_int/env_float behandeln einen leeren Wert als "nicht
      # gesetzt".
      - CHAT_MODEL=${CHAT_MODEL:-qwen3.8:27b}
      - CHAT_BASE_URL=${CHAT_BASE_URL:-}
      - CHAT_API_KEY=${CHAT_API_KEY:-}
      - CHAT_API_VERSION=${CHAT_API_VERSION:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:8b}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_API_VERSION=${EMBEDDING_API_VERSION:-}
      - VISION_MODEL=${VISION_MODEL:-qwen3-vl:32b}
      - VISION_BASE_URL=${VISION_BASE_URL:-}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_API_VERSION=${VISION_API_VERSION:-}
      - MIN_LONG_EDGE=${MIN_LONG_EDGE:-}
      - MIN_AREA=${MIN_AREA:-}
      - TITLE_MODEL=${TITLE_MODEL:-}
      - TITLE_BASE_URL=${TITLE_BASE_URL:-}
      - TITLE_API_KEY=${TITLE_API_KEY:-}
      - TITLE_API_VERSION=${TITLE_API_VERSION:-}
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-}
      - RERANKER_API_KEY=${RERANKER_API_KEY:-}
      - RERANKER_API_MODEL=${RERANKER_API_MODEL:-}
      - RERANKER_TIMEOUT=${RERANKER_TIMEOUT:-}
      - TOP_K=${TOP_K:-}
      - MAX_TABLE_CHARS=${MAX_TABLE_CHARS:-}
      - HELPER_TIMEOUT=${HELPER_TIMEOUT:-}
      - ANSWER_TIMEOUT=${ANSWER_TIMEOUT:-}
    ports:
      - "${APP_PORT:-8501}:8501"

    # Der CrossEncoder ist der einzige Torch-Nutzer im Container und laeuft
    # ohne die folgende Sektion auf der CPU. Bei 1024 Token Fenster und rund
    # 15-20 Kandidaten pro Frage kostet das einige Sekunden; mit GPU ist es
    # kaum messbar.
    #
    # Einkommentieren, wenn auf dem Host das NVIDIA Container Toolkit
    # eingerichtet ist. Wer bewusst auf der CPU bleibt, sollte stattdessen in
    # requirements.txt auf die CPU-Variante von torch wechseln -- das spart
    # mehrere GB Imagegroesse.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      # Ein einziger Mount fuer den kompletten Datenbestand. Er entspricht
      # exakt dem data/-Ordner, der zwischen Installationen weitergegeben
      # wird -- Hineinkopieren und Selbst-Erzeugen sind damit austauschbar.
      #
      #   data/dokumente   Original-PDFs
      #   data/chats       Chatverlaeufe je Nutzer
      #   data/chroma_db   Vektordatenbank
      #
      # Frueher lagen hier drei Einzel-Mounts nach /app/chroma_db,
      # /app/dokumente und /app/chats. Die App las aber aus /app/data/... --
      # also aus einem ungemounteten, leeren Verzeichnis.
      - ./data:/app/data

      # Als Verzeichnis gemountet, nicht als Einzeldatei: ein Bind-Mount auf
      # eine einzelne Datei bricht, sobald ein Werkzeug sie ersetzt statt sie
      # zu ueberschreiben.
      - ./config:/app/config

# Standortspezifisches gehoert NICHT hierher, sondern in eine
# docker-compose.override.yaml daneben. Docker Compose liest sie automatisch
# mit, sie ist gitignored und ueberlebt damit jedes Update aus dem Repo.
#
# Typischer Fall -- LiteLLM als Container im selben Netz plus aktive GPU:
#
#   services:
#     locanoto_bot:
#       deploy:
#         resources:
#           reservations:
#             devices:
#               - driver: nvidia
#                 count: all
#                 capabilities: [gpu]
#       networks:
#         - mein-netz
#   networks:
#     mein-netz:
#       external: true
