{% for room in rooms %}
<section class="card">
  <h2>{{ room.label }}</h2>
  {% if not room.files %}<p class="muted">{{ t('No documents yet.') }}</p>{% else %}
  <table class="files">
    {% for f in room.files %}
    <tr>
      <td>{{ f }}</td>
      {% if room.writable %}
      <td class="actions">
        <form hx-post="/ui/documents/move" hx-target="#doclist" class="inline">
          <input type="hidden" name="room" value="{{ room.id }}">
          <input type="hidden" name="file" value="{{ f }}">
          <select name="target" aria-label="{{ t('Move to') }}">
            {% for id, label in targets if id != room.id %}<option value="{{ id }}">{{ label }}</option>{% endfor %}
          </select>
          <button type="submit">{{ t('Move') }}</button>
        </form>
        <form hx-post="/ui/documents/delete" hx-target="#doclist" hx-confirm="{{ t('Delete this document?') }}" class="inline">
          <input type="hidden" name="room" value="{{ room.id }}">
          <input type="hidden" name="file" value="{{ f }}">
          <button type="submit" class="danger">{{ t('Delete') }}</button>
        </form>
      </td>
      {% endif %}
    </tr>
    {% endfor %}
  </table>
  {% endif %}
</section>
{% endfor %}
