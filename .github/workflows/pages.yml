# The project page on GitHub Pages (https://mw-research.github.io/LocaNoto/):
# site/ plus the logo files from web_static/. Pages must be switched on once
# in the repository: Settings -> Pages -> Source: GitHub Actions.
name: Webseite

on:
  push:
    branches: [main]
    paths:
      - site/**
      - web_static/logo.png
      - web_static/favicon.*
      - web_static/apple-touch-icon.png
      - .github/social-preview.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp web_static/logo.png web_static/favicon.ico web_static/favicon.png \
             web_static/apple-touch-icon.png .github/social-preview.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
