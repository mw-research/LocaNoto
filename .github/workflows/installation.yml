# Installs LocaNoto with deploy/locanoto-setup.py -- the way an admin
# would, without questions -- and checks the result from the outside:
# HTTPS with the internal root certificate, sign-in, a question answered
# end to end (by a stand-in model server), and doctor.py inside.
#
# Runs on every push to the enterprise branch that touches the code or
# the installer, and by hand. A first job waits for the image: the one of
# this very commit when the commit changed what goes into the image, else
# the newest one, once a running image build has finished. (A
# workflow_run trigger would be simpler, but it only fires for workflow
# files of the default branch.)
#
#   docker-minimal   this machine, core only
#   docker-full      + web search, OpenCloud, model gateway, classic pages
#   kind             Kubernetes (kind), internal CA, certificate issued by
#                    the installer
#   kind-certmanager Kubernetes, the installer installs cert-manager and it
#                    issues the certificate from the internal CA
name: Installation

on:
  push:
    branches: [enterprise]
    paths:
      - "**.py"
      - requirements.txt
      - Dockerfile
      - web_templates/**
      - web_static/**
      - deploy/**
      - .github/workflows/abbild.yml
      - .github/workflows/installation.yml
  workflow_dispatch:

concurrency:
  group: installation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ref: ${{ steps.wait.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the image
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY,,}"
          # Did this push change what goes into the image?
          CHANGED=1
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" \
              | grep -vE '^(deploy/|\.github/workflows/installation\.yml$|.*\.md$)' \
              | grep -qE '(\.py$|^requirements\.txt$|^Dockerfile$|^web_templates/|^web_static/|^\.github/workflows/abbild\.yml$)' \
              || CHANGED=0
          fi
          token() { curl -fsS "https://ghcr.io/token?scope=repository:$REPO:pull" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])'; }
          exists() { curl -fsS -o /dev/null -H "Authorization: Bearer $(token)" \
                     -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
                     "https://ghcr.io/v2/$REPO/manifests/$1"; }
          if [ "$CHANGED" = 1 ]; then
            TAG="enterprise-schlank-$GITHUB_SHA"
          else
            TAG="enterprise-schlank"
            # A build of an earlier commit may still be moving that tag.
            # Queued counts too: right after a push the build may not run yet.
            sleep 30
            for i in $(seq 1 90); do
              N=0
              for STATUS in queued in_progress; do
                C=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/abbild.yml/runs?branch=enterprise&status=$STATUS" \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["total_count"])')
                N=$((N + C))
              done
              [ "$N" = 0 ] && break
              echo "image build still running or queued"; sleep 60
            done
          fi
          for i in $(seq 1 90); do
            if exists "$TAG"; then
              echo "ref=ghcr.io/$OWNER/locanoto:$TAG" >> "$GITHUB_OUTPUT"
              echo "image: ghcr.io/$OWNER/locanoto:$TAG"
              exit 0
            fi
            echo "waiting for $TAG"; sleep 60
          done
          echo "image $TAG did not appear"; exit 1

  docker:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, full]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Stand-in model server
        run: |
          nohup python3 deploy/fake_models.py 8099 64 > /tmp/models.log 2>&1 &
          sleep 1; curl -fs http://127.0.0.1:8099/v1/models

      - name: Answers
        run: |
          IP=$(hostname -I | awk '{print $1}')
          echo "IP=$IP" >> "$GITHUB_ENV"
          FULL=${{ matrix.variant == 'full' && 'true' || 'false' }}
          cat > answers.json <<EOF
          {"target": "docker", "dir": "$HOME/locanoto", "host": "$IP",
           "tls": "internal", "model_url": "http://$IP:8099/v1",
           "chat_model": "fake-chat", "embedding_model": "fake-embed",
           "vision_model": "", "dimensions": 64, "admin_name": "admin",
           "cloud_host": "cloud.$IP.nip.io",
           "features": {"websearch": $FULL, "opencloud": $FULL,
                        "gateway": $FULL, "oidc": false, "pages": $FULL}}
          EOF
          cat answers.json

      - name: Install
        env:
          LOCANOTO_ADMIN_PASSWORD: Installtest-Passwort-1
        run: |
          python3 deploy/locanoto-setup.py --answers answers.json --yes \
            --state "$HOME/.locanoto" \
            --image "$IMAGE"

      - name: From the outside
        run: |
          CA="$HOME/.locanoto/ca.crt"
          curl -fsS --cacert "$CA" "https://$IP/api/v1/health"
          curl -fsS --cacert "$CA" -c jar -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Installtest-Passwort-1"}' \
            "https://$IP/api/v1/auth/login"
          CSRF=$(awk '$6=="locanoto_csrf"{print $7}' jar)
          curl -fsS --cacert "$CA" -b jar -H "X-LocaNoto-CSRF: $CSRF" \
            -F room=allgemein -F "file=@README.en.md" "https://$IP/api/v1/documents"
          ANSWER=$(curl -fsS --cacert "$CA" -b jar -H "X-LocaNoto-CSRF: $CSRF" \
            -H 'Content-Type: application/json' -d '{"question":"Wie lange ist die Prüffrist?"}' \
            "https://$IP/api/v1/ask")
          echo "$ANSWER" | head -c 600; echo
          echo "$ANSWER" | grep -q "vier Jahre"
          curl -fsS --cacert "$CA" -o /dev/null "https://$IP/login"

      - name: Upgrade without questions
        run: |
          python3 deploy/locanoto-setup.py --upgrade --yes --state "$HOME/.locanoto"

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f "$HOME/locanoto/compose.yaml" ps -a || true
          docker compose -f "$HOME/locanoto/compose.yaml" logs --tail 80 || true
          cat /tmp/models.log || true

  kind:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        certmanager: [false, true]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
      HOST: locanoto.test
    steps:
      - uses: actions/checkout@v4

      - name: Cluster config
        run: |
          cat > kind.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - {containerPort: 80, hostPort: 80, protocol: TCP}
                - {containerPort: 443, hostPort: 443, protocol: TCP}
          EOF

      - uses: helm/kind-action@v1
        with:
          config: kind.yaml
          cluster_name: locanoto

      - name: Ingress controller and stand-in models
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx rollout status deploy/ingress-nginx-controller --timeout=300s
          kubectl create configmap fake-models --from-file=deploy/fake_models.py
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: fake-models}
          spec:
            selector: {matchLabels: {app: fake-models}}
            template:
              metadata: {labels: {app: fake-models}}
              spec:
                containers:
                  - name: m
                    image: python:3.12-slim
                    command: ["python", "/m/fake_models.py", "8099", "64"]
                    volumeMounts: [{name: m, mountPath: /m}]
                volumes: [{name: m, configMap: {name: fake-models}}]
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: fake-models}
          spec:
            selector: {app: fake-models}
            ports: [{port: 8099, targetPort: 8099}]
          EOF
          kubectl rollout status deploy/fake-models --timeout=300s

      - name: Answers
        run: |
          cat > answers.json <<EOF
          {"target": "kubernetes", "namespace": "locanoto", "host": "$HOST",
           "tls": "internal", "install_cert_manager": ${{ matrix.certmanager }},
           "model_url": "http://fake-models.default.svc:8099/v1",
           "chat_model": "fake-chat", "embedding_model": "fake-embed",
           "vision_model": "", "dimensions": 64, "admin_name": "admin",
           "ingress_class": "nginx", "replicas": 1, "public_check": false,
           "features": {"websearch": true, "opencloud": false,
                        "gateway": false, "oidc": false, "pages": false}}
          EOF

      - name: Install
        env:
          LOCANOTO_ADMIN_PASSWORD: Installtest-Passwort-1
        run: |
          python3 deploy/locanoto-setup.py --answers answers.json --yes \
            --state "$HOME/.locanoto" \
            --image "$IMAGE"

      - name: From the outside
        run: |
          CA="$HOME/.locanoto/ca.crt"
          R="--resolve $HOST:443:127.0.0.1"
          for i in $(seq 1 30); do curl -fsS $R --cacert "$CA" "https://$HOST/api/v1/health" && break; sleep 5; done
          curl -fsS $R --cacert "$CA" -c jar -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Installtest-Passwort-1"}' \
            "https://$HOST/api/v1/auth/login"
          CSRF=$(awk '$6=="locanoto_csrf"{print $7}' jar)
          curl -fsS $R --cacert "$CA" -b jar -H "X-LocaNoto-CSRF: $CSRF" \
            -F room=allgemein -F "file=@README.en.md" "https://$HOST/api/v1/documents"
          ANSWER=$(curl -fsS $R --cacert "$CA" -b jar -H "X-LocaNoto-CSRF: $CSRF" \
            -H 'Content-Type: application/json' -d '{"question":"Wie lange ist die Prüffrist?"}' \
            "https://$HOST/api/v1/ask")
          echo "$ANSWER" | head -c 600; echo
          echo "$ANSWER" | grep -q "vier Jahre"

      - name: Upgrade without questions
        run: python3 deploy/locanoto-setup.py --upgrade --yes --state "$HOME/.locanoto"

      - name: Logs on failure
        if: failure()
        run: |
          kubectl -n locanoto get pods,ingress,secret -o wide || true
          kubectl -n locanoto describe pods | tail -80 || true
          kubectl -n locanoto logs deploy/server --all-containers --tail 80 || true
          kubectl get pods -A | grep -v Running || true
